<!DOCTYPE html>
<html>
<head>
    <title>Edge AI Agent Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1440px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px 35px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        .header h1 { font-size: 2em; font-weight: 800; letter-spacing: -0.5px; }
        .header p { opacity: 0.85; margin-top: 4px; font-weight: 300; }
        .header-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8em;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Stats Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(26, 31, 46, 0.9);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: default;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .card .value {
            font-size: 2em;
            font-weight: 700;
            transition: all 0.3s;
        }
        .card .label {
            color: #8899bb;
            margin-top: 5px;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-running { color: #4CAF50; }
        .status-stopped { color: #f44336; }
        
        /* Buttons */
        .flex {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0 20px;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            margin: 5px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); }
        .btn-start {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        .btn-stop {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        .btn-snapshot {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        .btn-report {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-refresh {
            background: linear-gradient(135deg, #607D8B, #455A64);
            color: white;
            box-shadow: 0 4px 15px rgba(96, 125, 139, 0.3);
        }
        
        /* Video + Events */
        .two-col {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .video-container {
            background: rgba(26, 31, 46, 0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
        }
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .video-header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #f44336;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        
        .events-list {
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
        }
        .events-list::-webkit-scrollbar {
            width: 4px;
        }
        .events-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .events-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        .event-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .event-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-high { background: #f44336; color: white; }
        .badge-medium { background: #FF9800; color: white; }
        .badge-low { background: #4CAF50; color: white; }
        .badge-info { background: #2196F3; color: white; }
        
        pre {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 0.75em;
            color: #8899bb;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 1000;
            animation: slideIn 0.5s ease;
            max-width: 400px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .toast-success { background: #4CAF50; color: white; }
        .toast-error { background: #f44336; color: white; }
        .toast-info { background: #2196F3; color: white; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .card-glass {
            background: rgba(26, 31, 46, 0.9);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
        }
        
        @media (max-width: 992px) {
            .two-col { grid-template-columns: 1fr; }
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 1.3em; }
        }
        
        .status-text {
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🚀 Edge Multimodal AI Agent</h1>
                <p>Smart Workspace Monitoring · Face · Eye · Fatigue Detection</p>
            </div>
            <div class="header-badge">
                <span class="live-dot"></span> LIVE
            </div>
        </div>
        
        <!-- Stats -->
        <div class="grid" id="stats">
            <div class="card"><div class="value" id="status_val">⏹️</div><div class="label">Agent Status</div></div>
            <div class="card"><div class="value" id="camera_val">📷</div><div class="label">Camera</div></div>
            <div class="card"><div class="value" id="faces_val">0</div><div class="label">Faces</div></div>
            <div class="card"><div class="value" id="persons_val">0</div><div class="label">Persons</div></div>
            <div class="card"><div class="value" id="events_val">0</div><div class="label">Events</div></div>
            <div class="card"><div class="value" id="fatigue_val">0%</div><div class="label">Fatigue Level</div></div>
        </div>
        
        <!-- Buttons -->
        <div class="flex">
            <button class="btn btn-start" onclick="startAgent()">▶ Start Agent</button>
            <button class="btn btn-stop" onclick="stopAgent()">⏹ Stop Agent</button>
            <button class="btn btn-snapshot" onclick="takeSnapshot()">📸 Snapshot</button>
            <button class="btn btn-report" onclick="generateReport()">📊 Report</button>
            <button class="btn btn-refresh" onclick="refreshStatus()">🔄 Refresh</button>
        </div>
        
        <!-- Video + Events -->
        <div class="two-col">
            <div class="video-container">
                <div class="video-header">
                    <span><span class="live-dot"></span> Live Camera Feed</span>
                    <span style="font-size:0.8em; opacity:0.6;">Detection Range: Up to 5m</span>
                </div>
                <img id="videoFeed" src="/video_feed" style="width:100%;" onerror="this.style.display='none'">
            </div>
            <div class="card-glass">
                <h3 style="margin-bottom:15px;">📋 Recent Events</h3>
                <div class="events-list" id="events_list">
                    <div style="color:#8899bb; padding:20px; text-align:center;">No events yet</div>
                </div>
            </div>
        </div>
        
        <!-- System Info -->
        <div class="card-glass" style="margin-top:20px;">
            <h3 style="margin-bottom:10px;">📊 System Info</h3>
            <pre id="system_info">Loading...</pre>
        </div>
    </div>
    
    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }
        
        async function fetchAPI(url) {
            try {
                const resp = await fetch(url, { cache: 'no-store' });
                return await resp.json();
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
                return { success: false };
            }
        }
        
        async function refreshStatus() {
            try {
                const resp = await fetch('/status', { cache: 'no-store' });
                const data = await resp.json();
                const d = data.data || {};
                const latest = d.latest_results || {};
                
                document.getElementById('status_val').textContent = d.running ? '✅ Running' : '⏹️ Stopped';
                document.getElementById('status_val').style.color = d.running ? '#4CAF50' : '#f44336';
                document.getElementById('camera_val').textContent = d.camera ? '📷 Active' : '📷 Inactive';
                document.getElementById('camera_val').style.color = d.camera ? '#4CAF50' : '#f44336';
                document.getElementById('events_val').textContent = d.events || 0;
                document.getElementById('faces_val').textContent = latest.faces || 0;
                document.getElementById('persons_val').textContent = latest.persons || 0;
                document.getElementById('fatigue_val').textContent = latest.fatigue_level ? Math.round(latest.fatigue_level) + '%' : '0%';
                
                const events = latest.events || [];
                const eventsDiv = document.getElementById('events_list');
                if (!events || events.length === 0) {
                    eventsDiv.innerHTML = '<div style="color:#8899bb; padding:20px; text-align:center;">No events yet</div>';
                } else {
                    eventsDiv.innerHTML = events.slice(0, 10).map(e => `
                        <div class="event-item">
                            <span>${e.type || 'event'}: ${e.description || ''}</span>
                            <span class="badge badge-${e.severity || 'info'}">${e.severity || 'info'}</span>
                        </div>
                    `).join('');
                }
                
                document.getElementById('system_info').textContent = JSON.stringify({
                    running: d.running,
                    camera: d.camera,
                    events: d.events,
                    latest: latest,
                    timestamp: new Date().toISOString()
                }, null, 2);
            } catch(e) {
                console.error('Refresh error:', e);
            }
        }
        
        async function startAgent() {
            showToast('Starting agent...', 'info');
            const result = await fetchAPI('/start_agent');
            if (result.success) {
                showToast('✅ ' + result.message, 'success');
            } else {
                showToast('❌ ' + result.message, 'error');
            }
            setTimeout(refreshStatus, 1000);
        }
        
        async function stopAgent() {
            showToast('Stopping agent...', 'info');
            const result = await fetchAPI('/stop_agent');
            if (result.success) {
                showToast('✅ ' + result.message, 'success');
            } else {
                showToast('❌ ' + result.message, 'error');
            }
            setTimeout(refreshStatus, 1000);
        }
        
        async function takeSnapshot() {
            showToast('Taking snapshot...', 'info');
            const result = await fetchAPI('/snapshot');
            if (result.success) {
                showToast('✅ Snapshot: ' + result.snapshot, 'success');
            } else {
                showToast('❌ ' + result.message, 'error');
            }
            setTimeout(refreshStatus, 1000);
        }
        
        async function generateReport() {
            showToast('Generating report...', 'info');
            const result = await fetchAPI('/generate_report');
            if (result.success) {
                showToast('✅ Report: ' + result.report, 'success');
            } else {
                showToast('❌ ' + result.error, 'error');
            }
            setTimeout(refreshStatus, 1000);
        }
        
        refreshStatus();
        setInterval(refreshStatus, 3000);
    </script>
</body>
</html>
